# Prometheus PULLS metrics: every few seconds it requests /actuator/prometheus from each target.
global:
  scrape_interval: 5s

scrape_configs:
  - job_name: server
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['server:8080']

  - job_name: worker
    metrics_path: /actuator/prometheus
    # Docker's DNS name "worker" resolves to every replica (docker compose up --scale worker=3), so new
    # workers are scraped automatically.
    dns_sd_configs:
      - names: ['worker']
        type: A
        port: 8081
