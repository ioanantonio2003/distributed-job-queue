services:
  postgres:
    image: postgres:17
    container_name: jobqueue-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jobqueue}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jobqueue}
      POSTGRES_DB: ${POSTGRES_DB:-jobqueue}
    ports:
      - "5432:5432"
    volumes:
      - jobqueue-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  jobqueue-pgdata:
