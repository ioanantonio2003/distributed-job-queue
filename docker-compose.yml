services:
  postgres:
    image: postgres:17
    container_name: jobqueue-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jobqueue}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jobqueue}
      POSTGRES_DB: ${POSTGRES_DB:-jobqueue}
    ports:
      - "5432:5432"
    volumes:
      - jobqueue-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build:
      context: .
      dockerfile: jobqueue-server/Dockerfile
    environment:
      # Inside the Compose network the database is reachable by its service name, not localhost.
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-jobqueue}
      DB_USER: ${POSTGRES_USER:-jobqueue}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-jobqueue}
      # Pass-through from the shell (used by scripts/chaos): when the variable is not set, nothing is passed
      # and the application default applies.
      JOBQUEUE_REAPER_INTERVAL:
    ports:
      - "8080:8080"
    # Longer than spring.lifecycle.timeout-per-shutdown-phase (20 s), so Docker does not SIGKILL a clean shutdown.
    stop_grace_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # wget exits non-zero on HTTP errors, and /actuator/health answers 503 when the app is DOWN.
      test: ["CMD-SHELL", "wget -qO /dev/null http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s

  # Scale with: docker compose up --build --scale worker=3
  # No container_name and no published port, so several replicas can coexist. Each replica gets its own
  # worker id (container hostname + random suffix, generated by WorkerProperties).
  worker:
    build:
      context: .
      dockerfile: jobqueue-worker/Dockerfile
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-jobqueue}
      DB_USER: ${POSTGRES_USER:-jobqueue}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-jobqueue}
      # Pass-through from the shell (used by scripts/chaos); unset means the application default.
      JOBQUEUE_WORKER_QUEUES:
      JOBQUEUE_WORKER_LEASE:
      JOBQUEUE_WORKER_SLOTS:
      # Per-queue concurrency for the two-queue demo (emails = fast, reports = slow); a queue named here is served.
      JOBQUEUE_WORKER_CONCURRENCY_EMAILS:
      JOBQUEUE_WORKER_CONCURRENCY_REPORTS:
      JOBQUEUE_WORKER_SHUTDOWN_GRACE:
    # On "docker stop" the worker drains for up to jobqueue.worker.shutdown-grace (20 s) and gives back the rest.
    # Longer than spring.lifecycle.timeout-per-shutdown-phase (40 s), so Docker does not SIGKILL a clean shutdown.
    stop_grace_period: 45s
    depends_on:
      # Waiting for the server means the schema has been migrated before any worker starts claiming.
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://localhost:8081/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s

  # Prometheus pulls /actuator/prometheus from the server and the workers (see docker/prometheus/prometheus.yml).
  prometheus:
    image: prom/prometheus:v2.55.1
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  # The dashboard is provisioned from files (docker/grafana/): open http://localhost:3000, no login needed to look.
  grafana:
    image: grafana/grafana:11.3.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/jobqueue.json
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  jobqueue-pgdata:
