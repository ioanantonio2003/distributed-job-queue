services:
  postgres:
    image: postgres:17
    container_name: jobqueue-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jobqueue}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jobqueue}
      POSTGRES_DB: ${POSTGRES_DB:-jobqueue}
    ports:
      - "5432:5432"
    volumes:
      - jobqueue-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build:
      context: .
      dockerfile: jobqueue-server/Dockerfile
    environment:
      # Inside the Compose network the database is reachable by its service name, not localhost.
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-jobqueue}
      DB_USER: ${POSTGRES_USER:-jobqueue}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-jobqueue}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # wget exits non-zero on HTTP errors, and /actuator/health answers 503 when the app is DOWN.
      test: ["CMD-SHELL", "wget -qO /dev/null http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s

  # Scale with: docker compose up --build --scale worker=3
  # No container_name and no published port, so several replicas can coexist. Each replica gets its own
  # worker id (container hostname + random suffix, generated by WorkerProperties).
  worker:
    build:
      context: .
      dockerfile: jobqueue-worker/Dockerfile
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-jobqueue}
      DB_USER: ${POSTGRES_USER:-jobqueue}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-jobqueue}
    depends_on:
      # Waiting for the server means the schema has been migrated before any worker starts claiming.
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://localhost:8081/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s

volumes:
  jobqueue-pgdata:
